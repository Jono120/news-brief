[project]
name = "brief-apac"
version = "0.1.0"
description = "APAC tech briefing MVP — ingest, review, publish workflow (en-NZ)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.8",
    "trustme>=1.2.1",
    "uvicorn[standard]>=0.50.0",
    "fastapi>=0.139.0",
    "python-multipart>=0.0.32",
    "supabase>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.1.0",
]

[project.scripts]
brief = "brief.cli:app"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["brief*"]

[tool.setuptools.package-data]
brief = ["templates/**/*", "static/**/*"]
